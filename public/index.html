<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Бар Борода — доставка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; }
    header { position: sticky; top:0; background:#fff; border-bottom:1px solid #eee; padding:12px 16px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; padding:12px 16px; }
    .card { border:1px solid #eee; border-radius:10px; padding:12px; width:calc(50% - 12px); box-sizing:border-box; }
    .card h4 { margin:6px 0; font-size:16px; }
    .price { font-weight:600; }
    .actions { display:flex; gap:8px; margin-top:8px; }
    .pill { border:1px solid #ddd; border-radius:999px; padding:6px 10px; cursor:pointer; }
    .cart { position:fixed; bottom:0; left:0; right:0; border-top:1px solid #eee; background:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; }
    .hidden { display:none; }
    label { display:block; margin:8px 0 4px; font-size:14px; }
    select, input { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:16px; }
    button { font:inherit; }
    .primary { width:100%; padding:13px; border:0; border-radius:10px; background:#6d45b5; color:white; font-weight:700; }
    .primary:disabled { opacity:.5; }
    .delivery-status { margin:10px 0; padding:10px; border-radius:8px; background:#f4f4f4; font-size:14px; }
    .delivery-status.ok { color:#176b2c; background:#ecf8ef; }
    .delivery-status.error { color:#a51d1d; background:#fff0f0; }
    #screen-checkout, #screen-profile { padding:12px 16px; }
    nav { display:flex; gap:8px; padding:8px 16px; border-top:1px solid #eee; }
    nav button { flex:1; padding:10px; }

    /* LOADING SCREEN ANIMATION */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN (показывается в начале загрузки) -->
  <div id="loadingScreen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  ">
    <div style="text-align: center; color: white;">
      <h1 style="font-size: 64px; margin: 0 0 20px 0;">🍔</h1>
      <h2 style="margin: 0; font-size: 28px; font-weight: 600;">Бар Борода</h2>
      <p style="margin: 15px 0 0 0; font-size: 14px; opacity: 0.85; letter-spacing: 0.5px;">Подождите, страница загружается...</p>
      <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
        <div style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 1.5s infinite;"></div>
        <div style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 1.5s infinite 0.3s;"></div>
        <div style="width: 10px; height: 10px; background: white; border-radius: 50%; animation: pulse 1.5s infinite 0.6s;"></div>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ (скрыто во время загрузки) -->
  <div id="app" style="display: none;">

    <header>
      <strong>Бар Борода — доставка</strong>
      <div id="tg-hint" style="font-size:12px; color:#666"></div>
    </header>

    <div id="screen-catalog">
      <div class="row" id="categories"></div>
      <div class="row" id="products"></div>
    </div>

    <div id="screen-checkout" class="hidden">
      <h3>Оформление</h3>

      <label>Как получить заказ</label>
      <select id="delivery-method">
        <option value="courier">Курьер</option>
        <option value="pickup">Самовывоз</option>
      </select>

      <label>Ваше имя</label>
      <input id="customer-name" autocomplete="name" placeholder="Имя"/>

      <label>Телефон</label>
      <input id="customer-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 999 123-45-67"/>

      <div id="address-wrap">
        <label>Адрес доставки</label>
        <input id="address" autocomplete="street-address" placeholder="Раменское, улица, дом"/>
        <button id="btn-check-address" class="pill" type="button" style="margin-top:8px">Проверить адрес</button>
        <div id="delivery-status" class="delivery-status">Введите адрес — мы автоматически определим зону и стоимость.</div>
      </div>

      <h4>Итого: <span id="total-sum">0</span> ₽</h4>
      <button id="btn-place" class="primary">Отправить заказ</button>
    </div>

    <div id="screen-profile" class="hidden">
      <h3>Личный кабинет</h3>
      <div id="profile"></div>
      <h4>Заказы</h4>
      <div id="orders"></div>
    </div>

    <div class="cart" id="cart-bar">
      <div><strong>Корзина:</strong> <span id="cart-count">0</span> поз.</div>
      <div><strong><span id="cart-sum">0</span> ₽</strong></div>
      <div class="actions">
        <button id="to-checkout" class="pill">Оформить</button>
        <button id="to-profile" class="pill">Профиль</button>
      </div>
    </div>

    <nav>
      <button id="tab-catalog">Каталог</button>
      <button id="tab-checkout">Оформление</button>
      <button id="tab-profile">Профиль</button>
    </nav>

  </div><!-- Конец #app -->

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); document.getElementById('tg-hint').textContent = 'Mini App открыт внутри Telegram'; }
    else { document.getElementById('tg-hint').textContent = 'Запусти через Telegram, чтобы видеть профиль'; }

    const state = { user:null, categories:[], products:[], cart:[], deliveryFee:0, deliveryQuote:null };

    const scrCatalog = document.getElementById('screen-catalog');
    const scrCheckout = document.getElementById('screen-checkout');
    const scrProfile = document.getElementById('screen-profile');
    function show(screen){ [scrCatalog,scrCheckout,scrProfile].forEach(el=>el.classList.add('hidden')); screen.classList.remove('hidden'); }

    document.getElementById('tab-catalog').onclick = () => show(scrCatalog);
    document.getElementById('tab-checkout').onclick = () => show(scrCheckout);
    document.getElementById('tab-profile').onclick = () => show(scrProfile);

    async function bootstrap(){
      const initData = tg?.initData || '';
      
      try {
        const res = await fetch('/api/bootstrap',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData}) });
        const data = await res.json();
        state.user = data.user;
        if (data.user?.first_name) document.getElementById('customer-name').value = data.user.first_name;
        
        if (!data.products || !data.products.length) {
          console.log('No products in bootstrap, fetching from /api/menu');
          const menuRes = await fetch('/api/menu');
          const menu = await menuRes.json();
          state.categories = menu.categories || [];
          state.products = menu.products || [];
          console.log('Loaded menu from /api/menu:', state.products.length, 'products');
        } else {
          state.categories = data.categories;
          state.products = data.products;
        }
        
        renderCategories();
        renderProducts(state.products);
        renderProfile(data.user);
        renderOrders(data.orders || []);
        
        // СКРЫВАЕМ LOADING SCREEN И ПОКАЗЫВАЕМ ПРИЛОЖЕНИЕ
        const loadingScreen = document.getElementById('loadingScreen');
        const app = document.getElementById('app');
        if (loadingScreen) loadingScreen.style.display = 'none';
        if (app) app.style.display = 'block';
        
        console.log('Bootstrap complete:', state.products.length, 'products loaded');
      } catch (err) {
        console.error('Bootstrap error:', err);
        alert('Ошибка загрузки: ' + err.message);
        // Показываем приложение даже если ошибка
        const app = document.getElementById('app');
        if (app) app.style.display = 'block';
      }
    }

    function renderCategories(){
      const wrap = document.getElementById('categories'); wrap.innerHTML = '';
      state.categories.forEach(c=>{
        const d = document.createElement('div');
        d.className='pill'; d.textContent=c.name;
        d.onclick=()=>renderProducts(state.products.filter(p=>p.categoryId===c.id));
        wrap.appendChild(d);
      });
      const all = document.createElement('div'); all.className='pill'; all.textContent='Все';
      all.onclick=()=>renderProducts(state.products); wrap.prepend(all);
    }

    function renderProducts(list){
      const wrap=document.getElementById('products'); wrap.innerHTML='';
      list.forEach(p=>{
        const card=document.createElement('div'); card.className='card';
        card.innerHTML=`
          <h4>${p.name}</h4>
          <div class="price">${p.price} ₽</div>
          <div style="font-size:12px;color:#666">${p.categoryName||''}</div>
          <div class="actions">
            <button class="pill" data-id="${p.id}">В корзину</button>
          </div>`;
        card.querySelector('button').onclick=()=>addToCart(p);
        wrap.appendChild(card);
      });
    }

    function addToCart(p){
      const item=state.cart.find(i=>i.id===p.id);
      if(item) item.qty++; else state.cart.push({id:p.id,name:p.name,price:p.price,qty:1});
      updateCartBar();
    }
    
    function updateCartBar(){
      const count=state.cart.reduce((s,i)=>s+i.qty,0);
      const sum=state.cart.reduce((s,i)=>s+i.qty*i.price,0)+state.deliveryFee;
      document.getElementById('cart-count').textContent=count;
      document.getElementById('cart-sum').textContent=sum;
      document.getElementById('total-sum').textContent=sum;
    }

    const selectMethod=document.getElementById('delivery-method');
    const addressWrap=document.getElementById('address-wrap');
    const addressInput=document.getElementById('address');
    const deliveryStatus=document.getElementById('delivery-status');
    const checkAddressButton=document.getElementById('btn-check-address');
    function recalcDelivery(){
      const method=selectMethod.value;
      addressWrap.style.display=(method==='courier')?'block':'none';
      if(method==='pickup') {
        state.deliveryQuote={available:true,zone:null,fee:0};
        state.deliveryFee=0;
      } else {
        state.deliveryQuote=null;
        state.deliveryFee=0;
        deliveryStatus.className='delivery-status';
        deliveryStatus.textContent='Введите адрес — мы автоматически определим зону и стоимость.';
      }
      updateCartBar();
    }
    selectMethod.onchange=recalcDelivery; recalcDelivery();

    addressInput.oninput=()=>{
      state.deliveryQuote=null;
      state.deliveryFee=0;
      deliveryStatus.className='delivery-status';
      deliveryStatus.textContent='Адрес изменён. Нажмите «Проверить адрес».';
      updateCartBar();
    };

    async function checkAddress(){
      const address=addressInput.value.trim();
      if(!address){ deliveryStatus.className='delivery-status error'; deliveryStatus.textContent='Введите улицу и номер дома.'; return null; }
      checkAddressButton.disabled=true;
      deliveryStatus.className='delivery-status';
      deliveryStatus.textContent='Проверяем адрес…';
      try {
        const res=await fetch('/api/delivery/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address})});
        const data=await res.json();
        if(!res.ok || !data.available) throw new Error(data.error || 'Адрес находится вне зоны доставки');
        state.deliveryQuote=data;
        state.deliveryFee=data.fee;
        deliveryStatus.className='delivery-status ok';
        deliveryStatus.textContent=`${data.zoneName}: доставка ${data.fee} ₽. ${data.formattedAddress}`;
        updateCartBar();
        return data;
      } catch(error) {
        state.deliveryQuote=null; state.deliveryFee=0; updateCartBar();
        deliveryStatus.className='delivery-status error';
        deliveryStatus.textContent=error.message;
        return null;
      } finally { checkAddressButton.disabled=false; }
    }
    checkAddressButton.onclick=checkAddress;

    document.getElementById('btn-place').onclick=async()=>{
      const initData=tg?.initData||'';
      if(!state.cart.length){ alert('Корзина пуста'); return; }
      if(selectMethod.value==='courier' && !state.deliveryQuote){
        const quote=await checkAddress(); if(!quote) return;
      }
      const button=document.getElementById('btn-place'); button.disabled=true; button.textContent='Отправляем…';
      const payload={
        initData,
        items:state.cart,
        customer:{name:document.getElementById('customer-name').value,phone:document.getElementById('customer-phone').value},
        delivery:{method:selectMethod.value,address:addressInput.value||null}
      };
      const res=await fetch('/api/orders',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      const data=await res.json();
      button.disabled=false; button.textContent='Отправить заказ';
      if(data.ok){ alert('Заказ создан #'+data.orderNumber); state.cart=[]; updateCartBar(); if(tg?.initData){ show(scrProfile); await loadOrders(); } }
      else { alert('Ошибка: '+data.error); }
    };
    document.getElementById('to-checkout').onclick=()=>show(scrCheckout);
    document.getElementById('to-profile').onclick=()=>show(scrProfile);

    async function loadOrders(){
      if(!tg?.initData) return renderOrders([]);
      const r=await fetch('/api/orders/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});
      const d=await r.json(); renderOrders(d.orders||[]);
    }
    
    function renderProfile(user){ const el=document.getElementById('profile'); if(!user){ el.textContent='Гость'; return; }
      el.innerHTML=`<div>Привет, ${user.first_name||'друг'}!</div><div style="font-size:12px;color:#666">Ваш Telegram ID: ${user.id}</div>`;
    }
    
    function renderOrders(orders){ const el=document.getElementById('orders'); el.innerHTML='';
      orders.forEach(o=>{ const d=document.createElement('div'); d.className='card';
        d.innerHTML=`<div><strong>№${o.number}</strong> — ${o.total} ₽ — ${o.status}</div><div style="font-size:12px;color:#666">${new Date(o.createdAt).toLocaleString()}</div>`;
        el.appendChild(d);
      });
    }

    bootstrap().catch(err=>alert('Bootstrap error: '+err.message));
  </script>

</body>
</html>
